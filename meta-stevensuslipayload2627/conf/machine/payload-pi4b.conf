#@TYPE: Machine
#@NAME: Stevens Rocketry payload (Raspberry Pi 4, 64-bit)
#@DESCRIPTION: Raspberry Pi 4B with payload peripherals

# Keep raspberrypi4-64-specific overrides in meta-raspberrypi working
MACHINEOVERRIDES =. "raspberrypi4-64:"

require conf/machine/raspberrypi4-64.conf

# Serial console on GPIO 14/15 (pins 8/10)
ENABLE_UART = "1"
# IC2
ENABLE_I2C = "1"

#Set device name
hostname:pn-base-files = "payload-dev-4B"

#Device Tree Config
RPI_EXTRA_CONFIG = "dtoverlay=imu-lsm6ds3trc"
RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/imu-lsm6ds3trc.dtbo"

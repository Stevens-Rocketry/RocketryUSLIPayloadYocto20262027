# meta-rocketry/conf/distro/rocketry.conf

require conf/distro/poky.conf

DISTRO = "rocketrypayload"
DISTRO_NAME = "Stevens Rocketry USLI Payload OS"
DISTRO_VERSION = "0.1"

# Use systemd
INIT_MANAGER = "systemd"

# Accept Broadcom/Synaptics Wi-Fi/BT firmware license (needed for Pi 4 onboard wireless)
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

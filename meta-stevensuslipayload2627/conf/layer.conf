# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-stevensuslipayload2627"
BBFILE_PATTERN_meta-stevensuslipayload2627 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-stevensuslipayload2627 = "6"

LAYERDEPENDS_meta-stevensuslipayload2627 = "core"
LAYERSERIES_COMPAT_meta-stevensuslipayload2627 = "wrynose"
